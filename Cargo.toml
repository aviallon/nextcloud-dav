[package]
name = "nextcloud-dav"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "A read-only CardDAV sidecar for Nextcloud that serves the DB directly"
license = "AGPL-3.0-or-later"

[lib]
name = "nextcloud_dav"
path = "src/lib.rs"

[[bin]]
name = "nextcloud-dav"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
calcard = { version = "0.3.14", default-features = false }
env_logger = "0.11.11"
hex = "0.4.3"
md-5 = "0.10.6"
httpdate = "1.0.3"
indexmap = "2.14.2"
log = "0.4.33"
nextcloud-config-parser = "0.15.4"
php-literal-parser = "0.7.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "charset",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "any",
  "mysql",
  "postgres",
  "sqlite",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
] }
thiserror = "2.0.20"
tokio = { version = "1.52.3", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[profile.release]
lto = true
