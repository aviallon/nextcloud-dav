[[deviation]]
id = "error-body-501"
area = "writes"
status = "accepted"
nextcloud = "A 501 from Sabre would carry Sabre's XML/HTML error body."
sidecar = "The 501 (returned for MKCOL/PROPPATCH/MOVE/COPY/POST, and for any write while native writes are unavailable) carries a plain-text body."
why = "nginx intercepts every sidecar 501 and re-dispatches to PHP, so a real client never sees this body. It exists to make the delegation explicit in logs."
test = "tests/deviations.rs::every_declared_deviation_holds (id=error-body-501)"
evidence = "src/routes.rs:not_implemented"

[[deviation]]
id = "files-property-gate-501"
area = "propfind"
status = "intentional"
nextcloud = "A files PROPFIND for a property Nextcloud serves returns it; for a property it does not know it returns a 404 propstat."
sidecar = "An explicit files PROPFIND whose property list contains any qname outside the implemented set is answered 501 (delegated to PHP), never 404. allprop/propname use Sabre's fixed 7-property list."
why = "A 404 would claim a property PHP serves is absent, which silently breaks clients. Delegating is always safe; the implemented set covers the web, desktop, gvfs and rclone property sets."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-property-gate-501)"
evidence = "src/files.rs:is_implemented; src/files.rs:handle_propfind"

[[deviation]]
id = "files-mount-delegation"
area = "delegation"
status = "intentional"
nextcloud = "View::getDirectoryContent() merges oc_mounts entries into a listing and View::getFileInfo() adds their sizes to the folder and synthesises its etag; mount roots are not rows in the parent storage's oc_filecache."
sidecar = "A files PROPFIND is answered 501 whenever an oc_mounts row for the user is at, under, or (for a collection) below the requested path. The home mount itself is ignored."
why = "oc_filecache alone silently drops every share/groupfolder/external mount and mis-sizes their parent. Delegating is the only way to stay correct without reimplementing the mount/permission wrappers."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-mount-delegation)"
evidence = "src/files.rs:mounts_delegate; docs/recon/files-propfind-model.md §2"

[[deviation]]
id = "files-non-propfind-501"
area = "delegation"
status = "intentional"
nextcloud = "OPTIONS advertises DAV/Allow for files; GET/HEAD serve bodies; the write methods mutate state."
sidecar = "Every non-PROPFIND files request (including OPTIONS) is answered 501 before authentication, so nginx replays it to PHP."
why = "The sidecar's OPTIONS advertises addressbook capabilities, which is wrong for files, and the whole files write path is PHP-owned. A 501 is the correct fallback signal."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-non-propfind-501)"
evidence = "src/routes.rs:handle_files"

[[deviation]]
id = "files-has-preview-static"
area = "propfind"
status = "accepted"
nextcloud = "nc:has-preview reflects PreviewManager::isAvailable(), which depends on the enabled apps and the loaded imagick/ffmpeg/libreoffice binaries."
sidecar = "nc:has-preview uses a static mimetype list (the always-registered core providers plus the common imagick/office/video formats); it does not detect the binaries or third-party providers."
why = "A database reader cannot see the PHP extension set or the provider registry. The list is deliberately generous so images, PDFs, office documents and videos keep their thumbnails; an unsupported type may report true and get a placeholder."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-has-preview-static)"
