test = "tests/deviations.rs::every_declared_deviation_holds (id=calendars-report-property-gate-501)"
evidence = "src/calendars.rs:object_gate_ok; src/calendars.rs:is_known_404_object"

[[deviation]]
id = "unauthenticated-delegates"
area = "auth"
status = "intentional"
nextcloud = "An unauthenticated DAV request is refused with 401 and `WWW-Authenticate: Basic` - but only after the session check: `OCA\\DAV\\Connector\\Sabre\\Auth::validateUserPass` returns true straight from a logged-in session (`isLoggedIn()` + `isDavAuthenticated()`), with no credentials involved at all. A request carrying a valid session cookie is therefore served, not refused."
sidecar = "A request with no Basic `Authorization` header is first evaluated against the Nextcloud session cookie when `nextcloud_dav.session_redis_url` is configured (`src/auth/session.rs`, design doc §6); if that path cannot prove the session exactly it is delegated (501 -> nginx replays it to PHP) instead of refused. With no session store configured (the integration-test env), or for an OAuth Bearer token, it always delegates. PHP returns the same 401 for a genuinely anonymous request and the 200 a session-cookie client expects. Credentials that are present but invalid still get 401, exactly as PHP does."
why = "A 401 carrying `WWW-Authenticate` makes the browser pop up a Basic Auth prompt. In production the web UI's DAV PROPFINDs (session cookie, no Basic) hit the sidecar and were refused - visible in the nginx access log as 401s on /remote.php/dav/files/<user>/ and /remote.php/dav/principals/users/<user>/ interleaved with the 207s the browser got on retry with cached credentials. Delegating (or, now, evaluating the session exactly) keeps the sidecar from being the component that refuses what PHP serves."
test = "tests/deviations.rs::every_declared_deviation_holds (id=unauthenticated-delegates)"
evidence = "src/routes.rs:authenticate_dav; src/auth/session.rs; tests/local/session_auth.sh"
