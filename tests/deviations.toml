status = "accepted"
nextcloud = "Directory::getQuotaInfo() -> OC_Helper::getStorageInfo() computes free = min(Local::free_space(), max(quota - used_root, 0)) for a finite quota."
sidecar = "The sidecar reproduces the quota arithmetic but, when the datadirectory is unavailable or statvfs fails, reports max(quota - used_root, 0) instead of the disk free space."
