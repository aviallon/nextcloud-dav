[[deviation]]
id = "files-is-encrypted-e2ee-delegated"
area = "delegation"
status = "intentional"
nextcloud = "nc:is-encrypted is served only by the end_to_end_encryption app (value 1/0). With no such handler Nextcloud returns a 404 propstat."
sidecar = "Without end_to_end_encryption enabled the sidecar serves the request natively and leaves nc:is-encrypted at 404, matching PHP. With that app enabled it answers 501 for a request containing nc:is-encrypted so PHP supplies the real value."
why = "The reference instance does not run end_to_end_encryption, so PHP 404s the property and the web UI / desktop client must still be served natively. Deriving the value from oc_filecache.encrypted would be wrong: that column is server-side encryption, not E2EE."
