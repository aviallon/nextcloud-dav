[[deviation]]
id = "groups-sorted"
area = "propfind"
status = "intentional"
nextcloud = "collectCardProperties() runs SELECT DISTINCT value with no ORDER BY, so oc:groups order is database order."
sidecar = "Returns oc:group values sorted by value (ORDER BY value)."
why = "Deterministic ordering is friendlier to clients and diffing; the set is identical."
test = "tests/deviations.rs::every_declared_deviation_holds (id=groups-sorted)"
evidence = "src/db.rs:contact_groups; apps/dav/lib/CardDAV/CardDavBackend.php:collectCardProperties"

[[deviation]]
id = "query-depth0-on-collection"
area = "report"
status = "resolved"
nextcloud = "addressbook-query with Depth: 0 on a collection raises ReportNotSupported (HTTP 415) because the target is not an ICard."
sidecar = "Returns 415 with a <d:supported-report/> body."
why = "Previously returned 207 with zero responses. Fixed."
test = "tests/deviations.rs::every_declared_deviation_holds (id=query-depth0-on-collection)"
evidence = "src/routes.rs:handle_report_book; 3rdparty/sabre/dav/lib/CardDAV/Plugin.php:402"

[[deviation]]
id = "authtoken-v2-only"
area = "auth"
status = "intentional"
nextcloud = "PublicKeyTokenMapper filters on PublicKeyToken::VERSION (2); other versions are not usable app passwords."
sidecar = "The fast path only matches version = 2; anything else (including legacy version 1 rows) is delegated to the PHP fallback."
why = "A mismatch can only cause a fallback, never an acceptance, so it is safe. Documented so a change in the filter is explicit."
test = "tests/deviations.rs::every_declared_deviation_holds (id=authtoken-v2-only)"
evidence = "src/db.rs:authtoken_by_hash; lib/private/Authentication/Token/PublicKeyToken.php"

[[deviation]]
id = "error-body-501"
area = "writes"
status = "accepted"
nextcloud = "A 501 from Sabre would carry Sabre's XML/HTML error body."
sidecar = "The 501 (returned for MKCOL/PROPPATCH/MOVE/COPY/POST, and for any write while native writes are unavailable) carries a plain-text body."
why = "nginx intercepts every sidecar 501 and re-dispatches to PHP, so a real client never sees this body. It exists to make the delegation explicit in logs."
test = "tests/deviations.rs::every_declared_deviation_holds (id=error-body-501)"
evidence = "src/routes.rs:not_implemented"
