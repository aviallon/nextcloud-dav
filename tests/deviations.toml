# Declared behavioural deviations of nextcloud-dav from Nextcloud / SabreDAV.
#
# Machine-readable companion to docs/DEVIATIONS.md. Every entry here MUST be
# asserted by tests/deviations.rs::every_declared_deviation_holds, which fails
# if the sidecar's behaviour (or the declared status) changes. The two files are
# kept in sync by tests/deviations.rs::deviations_toml_ids_match.
#
# status: intentional | accepted | temporary | likely-wrong | resolved
#
# `resolved` marks a former `likely-wrong` deviation that has been fixed; the
# assertion now pins the corrected behaviour.
#
# Fields:
#   id        stable identifier (also the dispatch key in the Rust test)
#   area      etag | delegation | routing | writes | auth | propfind | report | get | sync
#   status    see above
#   nextcloud what Nextcloud/SabreDAV does (source of truth)
#   sidecar   what nextcloud-dav does
#   why       rationale / risk
#   test      the test that asserts this deviation
#   evidence  file:line in the sidecar or upstream

[[deviation]]
id = "weak-etag-get"
area = "etag"
status = "accepted"
nextcloud = "PHP's GET may return a weak ETag (W/\"...\") while its own PROPFIND returns the strong \"...\" for the same card."
sidecar = "GET, HEAD and PROPFIND always return the strong quoted ETag."
why = "Investigated and accepted (dav-bench/CARDDAV_LIVE.md): the weak form's mechanism is not in the app source. Matching the PROPFIND form keeps client caching consistent."
test = "tests/deviations.rs::every_declared_deviation_holds (id=weak-etag-get)"
evidence = "src/routes.rs:get_card; src/model.rs:Card::quoted_etag"

[[deviation]]
id = "photo-delegated"
area = "delegation"
status = "accepted"
nextcloud = "GET ?photo returns a cached, resized avatar (PhotoCache + GD/appdata)."
sidecar = "Any request whose query contains ?photo returns 501 so nginx re-dispatches it to PHP."
why = "Photo generation needs appdata files and image processing, which the sidecar deliberately does not implement."
test = "tests/deviations.rs::every_declared_deviation_holds (id=photo-delegated)"
evidence = "src/routes.rs:query_requires_php"

[[deviation]]
id = "export-delegated"
area = "delegation"
status = "accepted"
nextcloud = "GET ?export returns a concatenated, re-serialised vCard export of the collection."
sidecar = "Any request whose query contains ?export returns 501 so nginx re-dispatches it to PHP."
why = "The export plugin changes the body format, so the sidecar cannot reproduce it byte-for-byte without porting the plugin."
test = "tests/deviations.rs::every_declared_deviation_holds (id=export-delegated)"
evidence = "src/routes.rs:query_requires_php"

[[deviation]]
id = "home-listing-php"
area = "routing"
status = "accepted"
nextcloud = "The address-book home listing is generated by PHP and also advertises the app-generated collections z-server-generated--system and z-app-generated--contactsinteraction--recent."
sidecar = "nginx keeps the home on PHP. The sidecar's own Home handler (reachable only on a misrouted request) lists just oc_addressbooks rows."
why = "Discovery happens once per client; PHP owns the app-generated collections the sidecar does not model."
test = "tests/deviations.rs::every_declared_deviation_holds (id=home-listing-php)"
evidence = "docs/ARCHITECTURE.md §3; src/routes.rs:handle_propfind (DavTarget::Home)"

[[deviation]]
id = "writes-501"
area = "writes"
status = "resolved"
nextcloud = "PUT/DELETE/MKCOL/PROPPATCH/MOVE/COPY/POST are handled by Sabre and mutate the database (and dispatch events)."
sidecar = "PUT and DELETE are native for a card (201/204, DB write + outbox row). MKCOL/PROPPATCH/MOVE/COPY/POST, and PUT/DELETE on a collection, still return 501 so nginx replays the buffered request to PHP."
why = "Card create/update/delete are the hot write path; collection management and the other methods stay in PHP."
test = "tests/deviations.rs::every_declared_deviation_holds (id=writes-501)"
evidence = "src/routes.rs:unsupported_method; src/routes.rs:put_card/delete_card; docs/ARCHITECTURE.md §7"

[[deviation]]
id = "shared-books-php"
area = "routing"
status = "resolved"
nextcloud = "Shared (oc_dav_shares), group and system address books are listed for the sharee and served with their share ACLs."
sidecar = "Owned and shared (direct user + database-group) address books are listed through one visible_books path and served with the sharing properties (owner-principal, read-only, owner, owner-displayname, the read-only privilege set). The system book and the app-generated contactsinteraction book still stay on PHP."
why = "The share/ACL model for oc_dav_shares books is implemented; only the non-row-backed collections remain delegated."
test = "tests/deviations.rs::every_declared_deviation_holds (id=shared-books-php)"
evidence = "src/db.rs:visible_books; src/routes.rs:resolve_book; docs/ARCHITECTURE.md §11"

[[deviation]]
id = "shared-unshare-tombstone-semantics"
area = "routing"
status = "intentional"
nextcloud = "CardDavBackend::getAddressBooksForUser() excludes unshared resources by matching the tombstone row's `id` against `dav_shares.id` (CardDavBackend.php:140-147); the CalDAV twin excludes by `resourceid`."
sidecar = "visible_books() excludes any share row whose `resourceid` has an access=5 tombstone for one of the caller's principals."
why = "The literal CardDAV form never hides a resource the sharee still reaches through a surviving group share (the tombstone is a separate row, so `s.id NOT IN (tombstone ids)` never matches). We use the intended, CalDAV-aligned `resourceid` semantics instead of reproducing the bug."
test = "tests/deviations.rs::every_declared_deviation_holds (id=shared-unshare-tombstone-semantics)"
evidence = "src/db.rs:visible_books; apps/dav/lib/CardDAV/CardDavBackend.php:140-147; apps/dav/lib/CalDAV/CalDavBackend.php:396-406"

[[deviation]]
id = "shared-write-actor"
area = "writes"
status = "intentional"
nextcloud = "A card written into a shared book is attributed to the sharee (the current session user) by the activity listener."
sidecar = "The oc_dav_event_outbox row has no actor column, so the PHP worker (which runs without a session user) attributes a shared-book write to the address book owner."
why = "An `actor_uid` column on oc_dav_event_outbox (plus a companion-app migration) is the future fix; the frozen schema and the app's migration are unchanged for now."
test = "tests/deviations.rs::every_declared_deviation_holds (id=shared-write-actor)"
evidence = "src/db.rs:insert_outbox; docs/recon/shared-addressbooks.md §3.3"

[[deviation]]
id = "shared-books-group-backends"
area = "routing"
status = "intentional"
nextcloud = "Principal::getGroupMembership() merges every registered group backend (LDAP, circles) through traitGetGroupMembership and skips groups for which hideFromCollaboration() is true."
sidecar = "Group principals are expanded from oc_group_user/oc_groups only; LDAP/circle membership and hideFromCollaboration() are not visible in the schema."
why = "With the database group backend the other sources are empty, so the two agree. A deployment using LDAP or circles for the affected users would miss those shares; the home listing stays on PHP anyway."
test = "tests/deviations.rs::every_declared_deviation_holds (id=shared-books-group-backends)"
evidence = "src/db.rs:group_principals; apps/dav/lib/Connector/Sabre/Principal.php:187-217"

[[deviation]]
id = "shared-books-listing-order"
area = "routing"
status = "intentional"
nextcloud = "getAddressBooksForUser() adds no ORDER BY, so shared rows come back in database order."
sidecar = "visible_books() returns owned books first (ordered by id) and then shared rows ORDER BY a.id."
why = "Deterministic output is friendlier to clients and diffing. Owned-first is also required for the wire-name collision rule (Sabre returns the first matching child), not just a style choice."
test = "tests/deviations.rs::every_declared_deviation_holds (id=shared-books-listing-order)"
evidence = "src/db.rs:visible_books"

[[deviation]]
id = "contactsinteraction-php"
area = "routing"
status = "accepted"
nextcloud = "The app-generated book z-app-generated--contactsinteraction--recent (and z-server-generated--system) exist as virtual collections served by PHP plugins."
sidecar = "They are not modelled, so the sidecar answers 501 and nginx replays the request to PHP, which serves them. The home listing is PHP's too."
why = "App-generated collections are produced by PHP plugins, not by rows the sidecar reads. 501 (delegate) rather than 404 (deny) keeps clients that were told about them by the home listing working."
test = "tests/deviations.rs::every_declared_deviation_holds (id=contactsinteraction-php)"
evidence = "src/routes.rs:is_delegated_book_uri; apps/dav/lib/CardDAV/Integration/ExternalAddressBook.php; apps/dav/lib/CardDAV/SystemAddressbook.php"

[[deviation]]
id = "bruteforce-recording-off"
area = "auth"
status = "intentional"
nextcloud = "Failed logins are recorded in oc_bruteforce_attempts by DatabaseBackend::registerAttempt()."
sidecar = "The delay/block checks always run, but new failures are only recorded when nextcloud_dav.record_bruteforce_attempts is true (default false)."
why = "Keeps the auth path read-only, so authentication needs no DB write grant. The PHP fallback still records failures; turn it on for full throttling parity."
test = "tests/deviations.rs::every_declared_deviation_holds (id=bruteforce-recording-off)"
evidence = "src/config.rs:BruteforceConfig::default; src/auth/mod.rs:record_failure"

[[deviation]]
id = "no-event-dispatch"
area = "writes"
status = "intentional"
nextcloud = "createCard/updateCard/deleteCard dispatch CardCreatedEvent/CardUpdatedEvent/CardDeletedEvent synchronously, and the listeners run before the request returns."
sidecar = "A native write queues the event in oc_dav_event_outbox inside the card transaction and runs no listener itself; the companion PHP worker drains the queue."
why = "Queuing decouples the card write from the listeners (a failing BirthdayListener can no longer roll back the PUT) while the outbox row makes the event durable and atomic with the card."
test = "tests/deviations.rs::every_declared_deviation_holds (id=no-event-dispatch)"
evidence = "src/db.rs:insert_outbox; src/outbox.rs; docs/recon/event-dispatch.md §1"

[[deviation]]
id = "events-queued-not-dispatched"
area = "writes"
status = "intentional"
nextcloud = "The request returns only after every effect (activity, birthday, photo cache, notifications, Redis DEL) has run."
sidecar = "The request returns after committing exactly one pending outbox row (state = 0) and a transactional pg_notify; no effect runs in the sidecar process."
why = "Phase 1 keeps every effect in PHP. The frozen effects map records the ownership so a later phase can move one effect to Rust without double dispatch."
test = "tests/deviations.rs::every_declared_deviation_holds (id=events-queued-not-dispatched)"
evidence = "src/db.rs:insert_outbox; src/outbox.rs:EffectRegistry"

[[deviation]]
id = "jcard-rejected"
area = "writes"
status = "intentional"
nextcloud = "A body starting with `[` is parsed as jCard (RFC 7095) and re-serialised to vCard before storage."
sidecar = "jCard PUT bodies are rejected with 415; only vCard text is accepted."
why = "Re-serialising to vCard would break byte stability and the ETag. jCard is declared unsupported instead of being silently converted."
test = "tests/deviations.rs::every_declared_deviation_holds (id=jcard-rejected)"
evidence = "src/vcard_validate.rs:validate; 3rdparty/sabre/dav/lib/CardDAV/Plugin.php:validateVCard"

[[deviation]]
id = "vcard-2.1-rejected"
area = "writes"
status = "intentional"
nextcloud = "vCard 2.1 is level 3 (rejected) under PROFILE_CARDDAV; the sidecar also has no REPAIR layer, so 2.1 is never upgraded."
sidecar = "A VERSION other than 3.0 or 4.0 (including 2.1) is rejected with 415."
why = "CardDAV servers must not accept 2.1. We do not implement Sabre's REPAIR, so the only safe behaviour is to match the strict result."
test = "tests/deviations.rs::every_declared_deviation_holds (id=vcard-2.1-rejected)"
evidence = "src/vcard_validate.rs:validate; 3rdparty/sabre/vobject/lib/Component/VCard.php:validate"

[[deviation]]
id = "effect-ownership-registry"
area = "writes"
status = "intentional"
nextcloud = "Effects are produced unconditionally by the PHP listeners registered on the card events."
sidecar = "Every effect id is claimed by exactly one backend in the registry; phase 1 is all `php` with an empty `rust` list, frozen into each outbox row."
why = "Single ownership makes double dispatch structurally impossible when an effect later moves to Rust."
test = "tests/deviations.rs::every_declared_deviation_holds (id=effect-ownership-registry)"
evidence = "src/outbox.rs:EffectRegistry; docs/recon/event-dispatch.md §3.4"

[[deviation]]
id = "allprop-curated"
area = "propfind"
status = "intentional"
nextcloud = "PROPFIND allprop returns every live property Sabre knows for the node."
sidecar = "allprop (and propname) return a curated per-node property set (see src/routes.rs:default_props)."
why = "The curated set covers what real CardDAV clients request; enumerating every property is not implemented."
test = "tests/deviations.rs::every_declared_deviation_holds (id=allprop-curated)"
evidence = "src/routes.rs:default_props; docs/ARCHITECTURE.md §11"

[[deviation]]
id = "vcard-version-negotiation-missing"
area = "report"
status = "intentional"
nextcloud = "address-data honours the requested content-type/version and the child <card:prop> filter, re-serialising the vCard."
sidecar = "address-data is returned exactly as stored; the version/content-type attributes and the child prop filter are parsed but ignored."
why = "No vCard 3<->4 converter is implemented; clients that request 4.0 get the stored (usually 3.0) bytes."
test = "tests/deviations.rs::every_declared_deviation_holds (id=vcard-version-negotiation-missing)"
evidence = "src/routes.rs:resolve_property (address-data); src/xml/parse.rs:AddressDataRequest"

[[deviation]]
id = "conditional-get-missing"
area = "get"
status = "intentional"
nextcloud = "Sabre evaluates If-None-Match / If-Modified-Since and can answer 304."
sidecar = "ETag and Last-Modified are sent, but the conditional request headers are ignored, so GET always returns 200 with the body."
why = "Clients re-download; correctness is unaffected. Not implemented in v1."
test = "tests/deviations.rs::every_declared_deviation_holds (id=conditional-get-missing)"
evidence = "src/routes.rs:get_card"

