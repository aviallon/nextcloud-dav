[[deviation]]
id = "discovery-non-propfind-501"
area = "delegation"
status = "intentional"
nextcloud = "OPTIONS advertises the DAV/Allow capability headers for the DAV root and a principal; the write methods mutate state."
sidecar = "Every non-PROPFIND discovery request (including OPTIONS) is answered 501 before authentication, so nginx replays it to PHP."
why = "PHP's DAV/Allow headers are long and getting them subtly wrong would break capability discovery; the sidecar's OPTIONS advertises addressbook capabilities, which is wrong here. A 501 is the correct fallback signal."
