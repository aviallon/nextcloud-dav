status = "intentional"
nextcloud = "ShareDisableChecker::sharingDisabledForUser() strips the SHARE permission from every child when core/shareapi_exclude_groups is configured and the user is (not) in an excluded group."
sidecar = "When core/shareapi_exclude_groups is configured, every files PROPFIND is answered 501. Otherwise oc:permissions carries the stored permissions unchanged."
