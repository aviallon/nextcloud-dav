[[deviation]]
id = "files-non-propfind-501"
area = "delegation"
status = "intentional"
nextcloud = "OPTIONS advertises DAV/Allow for files; GET/HEAD serve bodies; the write methods mutate state."
sidecar = "Every non-PROPFIND files request (including OPTIONS) is answered 501 before authentication, so nginx replays it to PHP."
why = "The sidecar's OPTIONS advertises addressbook capabilities, which is wrong for files, and the whole files write path is PHP-owned. A 501 is the correct fallback signal."
