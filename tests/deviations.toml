[[deviation]]
id = "sync-invalid-token-400"
area = "sync"
status = "resolved"
nextcloud = "A sync-token that does not start with http://sabre.io/ns/sync/ raises Sabre\\DAV\\Exception\\InvalidSyncToken, which extends Forbidden => HTTP 403 with a <d:valid-sync-token/> precondition body."
sidecar = "Returns 403 with the same <d:valid-sync-token/> body."
