[[deviation]]
id = "error-body-501"
area = "writes"
status = "accepted"
nextcloud = "A 501 from Sabre would carry Sabre's XML/HTML error body."
sidecar = "The 501 (returned for MKCOL/PROPPATCH/MOVE/COPY/POST, and for any write while native writes are unavailable) carries a plain-text body."
why = "nginx intercepts every sidecar 501 and re-dispatches to PHP, so a real client never sees this body. It exists to make the delegation explicit in logs."
test = "tests/deviations.rs::every_declared_deviation_holds (id=error-body-501)"
evidence = "src/routes.rs:not_implemented"

[[deviation]]
id = "files-property-gate-501"
area = "propfind"
status = "intentional"
nextcloud = "A files PROPFIND for a property Nextcloud serves returns it; for a property it does not know it returns a 404 propstat."
sidecar = "An explicit files PROPFIND whose property list contains any qname outside the implemented set is answered 501 (delegated to PHP), never 404. allprop/propname use Sabre's fixed 7-property list."
why = "A 404 would claim a property PHP serves is absent, which silently breaks clients. Delegating is always safe; the implemented set covers the web, desktop, gvfs and rclone property sets."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-property-gate-501)"
evidence = "src/files.rs:is_implemented; src/files.rs:handle_propfind"

[[deviation]]
id = "files-mount-delegation"
area = "delegation"
status = "intentional"
nextcloud = "View::getDirectoryContent() merges oc_mounts entries into a listing and View::getFileInfo() adds their sizes to the folder and synthesises its etag; mount roots are not rows in the parent storage's oc_filecache."
sidecar = "The mount model is served natively (home root, listings inside/containing share, groupfolder and local external mounts, the synthetic parent etag/size/mtime, and the groupfolder ACL rule engine). A mount whose *contents* the model cannot reproduce still contributes its entry to a listing that contains it; a request at or under such a mount, or a listing that contains a mount whose root row is gone, is answered 501, never a wrong listing or a 404. The remaining unservable cases are declared separately."
why = "Serving the model removes the 85% home-root PROPFIND from PHP; the unservable cases are the ones whose inputs are not in the core schema (circles) or whose cache PHP would refresh from the backend."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-mount-delegation)"
evidence = "src/mounts.rs; src/files.rs:handle_propfind; docs/recon/files-mounts-model.md §9"

[[deviation]]
id = "files-mount-external-backend-delegated"
area = "delegation"
status = "intentional"
nextcloud = "A files_external mount with a non-local backend (S3, WebDAV, ...) is listed from that backend's storage."
sidecar = "A files_external mount whose oc_external_mounts.storage_backend is not 'local' has unservable contents: a request at or under it is answered 501. A listing that merely contains it is still served and merges the mount entry (name/etag/mtime/size/mimetype/permissions/mount-type) from oc_mounts plus the root oc_filecache row."
why = "A non-local backend's filecache is empty or stale; reproducing its listing needs the remote, not SQL."
test = "tests/deviations.rs::every_declared_deviation_holds (id=files-mount-external-backend-delegated)"
evidence = "src/mounts.rs:apply_external_mask"

[[deviation]]
id = "files-mount-external-check-changes-delegated"
area = "delegation"
status = "intentional"
nextcloud = "A local files_external mount with filesystem_check_changes = CHECK_ALWAYS stats the local path and may rescan before answering (View::getCacheEntry -> Watcher::needsUpdate)."
sidecar = "A local files_external mount with filesystem_check_changes != 0 has unservable contents: a request at or under it is answered 501. A listing that merely contains it is still served and merges its entry."
