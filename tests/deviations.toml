[[deviation]]
id = "files-has-preview-static"
area = "propfind"
status = "accepted"
nextcloud = "nc:has-preview reflects PreviewManager::isAvailable(), which depends on the enabled apps and the loaded imagick/ffmpeg/libreoffice binaries."
