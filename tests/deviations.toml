[[deviation]]
id = "discovery-property-gate-501"
area = "propfind"
status = "intentional"
nextcloud = "A discovery PROPFIND for a property Nextcloud serves returns it; for a property it does not know it returns a 404 propstat."
sidecar = "An explicit discovery PROPFIND whose property list contains any qname outside the implemented set is answered 501 (delegated to PHP), never 404. allprop/propname reproduce PHP's result for these nodes (just {DAV:}resourcetype)."
why = "A 404 would claim a property PHP serves is absent, which silently breaks clients. The implemented set is the exact live 200 set for the two nodes (root: resourcetype, current-user-principal, principal-collection-set, supported-report-set, current-user-privilege-set; principal: adds principal-URL, displayname, owner, alternate-URI-set, group-membership, card:addressbook-home-set, cal:calendar-home-set, cal:calendar-user-address-set, cal:calendar-user-type, nc:language, s:email-address)."
test = "tests/deviations.rs::every_declared_deviation_holds (id=discovery-property-gate-501)"
evidence = "src/discovery.rs:is_implemented; src/discovery.rs:handle_propfind"

[[deviation]]
id = "discovery-own-principal-only"
area = "delegation"
status = "intentional"
nextcloud = "Any authenticated user can PROPFIND another user's principal; the response's current-user-principal is the *caller's* principal."
sidecar = "Only the authenticated user's own principal is served. Another user's principal answers 501 so nginx replays it to PHP."
why = "The response mixes the target uid (href, displayname, homes) with caller-scoped properties (current-user-principal, current-user-privilege-set). Reproducing that from the target uid alone would be inventing an answer; delegation is safe and the discovery chain only ever asks for the caller's own principal."
test = "tests/deviations.rs::every_declared_deviation_holds (id=discovery-own-principal-only)"
evidence = "src/discovery.rs:handle_propfind"

[[deviation]]
