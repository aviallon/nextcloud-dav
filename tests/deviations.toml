[[deviation]]
id = "authtoken-v2-only"
area = "auth"
status = "intentional"
nextcloud = "PublicKeyTokenMapper filters on PublicKeyToken::VERSION (2); other versions are not usable app passwords."
sidecar = "The fast path only matches version = 2; anything else (including legacy version 1 rows) is delegated to the PHP fallback."
why = "A mismatch can only cause a fallback, never an acceptance, so it is safe. Documented so a change in the filter is explicit."
test = "tests/deviations.rs::every_declared_deviation_holds (id=authtoken-v2-only)"
